<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<title>
AI校园智能服务机器人
</title>


<style>

body{

margin:0;
background:#0f172a;
font-family:"Microsoft YaHei";
color:white;

}


.header{

padding:25px;

background:#111827;

border-bottom:1px solid #334155;

}


.header h1{

color:#38bdf8;

margin:0;

}


.header p{

color:#94a3b8;

}



.container{

display:grid;

grid-template-columns:1fr 2fr 1fr;

gap:15px;

padding:20px;


}



.panel{

background:#1e293b;

border-radius:15px;

padding:20px;

}


.title{

font-size:20px;

color:#38bdf8;

margin-bottom:20px;

}



.card{

background:#334155;

padding:15px;

border-radius:10px;

margin-bottom:15px;

}


.node{

background:#0f766e;

padding:10px;

border-radius:8px;

margin:10px 0;

}



.chat{

height:250px;

overflow:auto;

background:#020617;

padding:15px;

border-radius:10px;

}


.msg{

padding:10px;

margin:10px 0;

border-radius:8px;

}


.user{

background:#2563eb;

}



.ai{

background:#334155;

}



input{

width:75%;

padding:12px;

border-radius:8px;

border:none;

}



button{

padding:12px 20px;

background:#38bdf8;

border:none;

border-radius:8px;

cursor:pointer;

}


.status{

color:#4ade80;

}


</style>

</head>


<body>



<div class="header">

<h1>
🤖 AI校园智能服务机器人
</h1>

<p>
基于大语言模型 + 知识图谱 + 机器人任务规划
</p>

</div>




<div class="container">



<!--知识图谱-->

<div class="panel">


<div class="title">
📚 校园知识图谱
</div>



<div class="node">

🏫 物理实验室

<br>

↓

<br>

科学楼3层

<br>

↓

<br>

14:00-17:00开放

</div>


<div class="node">

📖 图书馆

<br>

↓

<br>

中心楼

<br>

↓

<br>

8:00-22:00开放

</div>


<div class="node">

🍚 食堂

<br>

↓

<br>

生活区1层

</div>



<hr>


<h3>
🤖机器人能力
</h3>


<div class="card">

✓ 语音理解

<br><br>

✓ 信息查询

<br><br>

✓ 简单移动

<br><br>

✓ 超声波避障


</div>



</div>





<!--AI-->

<div class="panel">


<div class="title">

💬 AI智能助手

</div>



<div class="chat" id="chat">


<div class="msg ai">

您好，我是校园智能机器人。

<br>

请输入您的需求。

</div>


</div>



<br>


<input id="input"

placeholder="例如：下午想去物理实验室">


<button onclick="send()">

分析

</button>




<div id="result">


</div>




</div>





<!--机器人-->

<div class="panel">


<div class="title">

🚗机器人状态

</div>


<div class="card">

当前位置：

<br>

📍校门入口

</div>


<div class="card">

目标：

<br>

<span id="target">

等待任务

</span>

</div>



<div class="card">

状态：

<br>

<span class="status">

等待规划

</span>

</div>



<div class="card">

📡传感器

<br><br>

超声波：

正常

<br>

距离：

35cm


</div>



<div class="card">


🧠决策依据


<br><br>


✓ 用户需求分析

<br>

✓ 知识图谱查询

<br>

✓ 能力约束


</div>



</div>



</div>





<script>


function send(){


let text=document.getElementById("input").value;


let chat=document.getElementById("chat");



chat.innerHTML +=

`

<div class="msg user">

${text}

</div>

`;



let target="未知地点";

let info="暂无数据";



if(text.includes("物理")||text.includes("实验")){


target="物理实验室";


info=

`

位置：科学楼3层

<br>

开放：14:00-17:00

<br>

功能：力学、电磁实验

`;



}



else if(text.includes("图书馆")){


target="图书馆";


info=

`

位置：中心楼

<br>

开放：8:00-22:00

<br>

功能：自习学习

`;



}



else if(text.includes("吃饭")||text.includes("食堂")){


target="食堂";


info=

`

位置：生活区1层

<br>

开放：7:00-21:00

`;

}


chat.innerHTML +=


`

<div class="msg ai">


<b>
① 用户需求理解
</b>


<br><br>


目标：

${target}



<br><br>


<b>

② 知识图谱查询

</b>


<br><br>


${info}



<br><br>


<b>

③ 任务规划

</b>


<br><br>


✓ 查询校园信息

<br>

✓ 规划服务路线

<br>

✓ 调度机器人


</div>


`;



document.getElementById("target").innerHTML=target;



chat.scrollTop=chat.scrollHeight;


}


</script>


</body>

</html>
